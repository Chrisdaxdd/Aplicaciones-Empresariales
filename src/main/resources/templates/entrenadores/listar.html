<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolManager - Entrenadores (MongoDB REST)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <div th:replace="~{fragments/navbar :: navbar('entrenadores')}"></div>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-person-badge text-success me-2"></i>Gestión de Entrenadores (MongoDB NoSQL)</h2>
                <p class="text-muted mb-0">Cuerpo técnico consumido mediante <code>GET /api/entrenadores</code></p>
            </div>
            <a th:href="@{/entrenadores/nuevo}" class="btn btn-success px-3 shadow-sm">
                <i class="bi bi-plus-circle me-1"></i> Registrar Entrenador
            </a>
        </div>

        <div id="alerta" class="alert alert-dismissible fade show shadow-sm d-none" role="alert">
            <span id="alertaTexto"></span>
            <button type="button" class="btn-close" onclick="document.getElementById('alerta').classList.add('d-none')"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Edad</th>
                                <th>Nacionalidad</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyEntrenadores">
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <span class="spinner-border spinner-border-sm me-2 text-success"></span>Cargando entrenadores desde la API REST...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', cargarEntrenadores);

        async function cargarEntrenadores() {
            try {
                const res = await fetch('/api/entrenadores');
                const entrenadores = await res.json();
                const tbody = document.getElementById('tbodyEntrenadores');

                if (!entrenadores || entrenadores.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted"><i class="bi bi-person-slash fs-1 d-block mb-2"></i>No hay entrenadores registrados en MongoDB.</td></tr>';
                    return;
                }

                tbody.innerHTML = entrenadores.map(e => `
                    <tr>
                        <td class="ps-4 fw-bold">${e.id}</td>
                        <td class="fw-bold">${e.nombre}</td>
                        <td>${e.apellido}</td>
                        <td><span class="badge bg-light text-dark border">${e.edad} años</span></td>
                        <td><span class="badge bg-secondary">${e.nacionalidad}</span></td>
                        <td class="text-end pe-4">
                            <div class="btn-group">
                                <a href="/entrenadores/editar/${e.id}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                <button onclick="eliminarEntrenador(${e.id})" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('tbodyEntrenadores').innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        async function eliminarEntrenador(id) {
            if (confirm(`¿Eliminar entrenador #${id} mediante DELETE /api/entrenadores/${id}?`)) {
                try {
                    const res = await fetch(`/api/entrenadores/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        mostrarAlerta('Entrenador eliminado exitosamente mediante API REST', 'success');
                        cargarEntrenadores();
                    } else {
                        mostrarAlerta('Error al eliminar en la API REST', 'danger');
                    }
                } catch (e) {
                    mostrarAlerta('Error de conexión: ' + e.message, 'danger');
                }
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.className = `alert alert-${tipo} alert-dismissible fade show shadow-sm`;
            document.getElementById('alertaTexto').innerText = mensaje;
            alerta.classList.remove('d-none');
        }
    </script>
</body>
</html>
