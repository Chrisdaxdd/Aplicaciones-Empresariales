<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolManager - Formulario de Entrenador (REST API)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <div th:replace="~{fragments/navbar :: navbar('entrenadores')}"></div>

    <main class="container my-5" style="max-width: 700px;">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0 fw-bold">
                    <i class="bi bi-person-badge me-2"></i>
                    <span id="formTitulo">Registrar Entrenador (vía POST /api/entrenadores)</span>
                </h4>
            </div>
            <div class="card-body p-4">
                <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

                <form id="formEntrenador" onsubmit="guardarEntrenador(event)">
                    <input type="hidden" id="entrenadorId" th:value="${entrenadorId}" />

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
                            <input type="text" id="nombre" class="form-control" required placeholder="Ej. Alberto, Pep, Carlo" />
                        </div>

                        <div class="col-md-6">
                            <label for="apellido" class="form-label fw-bold">Apellido <span class="text-danger">*</span></label>
                            <input type="text" id="apellido" class="form-control" required placeholder="Ej. Gamero, Guardiola, Ancelotti" />
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="edad" class="form-label fw-bold">Edad <span class="text-danger">*</span></label>
                            <input type="number" id="edad" class="form-control" min="18" max="99" required value="45" />
                        </div>

                        <div class="col-md-6">
                            <label for="nacionalidad" class="form-label fw-bold">Nacionalidad <span class="text-danger">*</span></label>
                            <input type="text" id="nacionalidad" class="form-control" required placeholder="Ej. Colombiana, Argentina, Española" />
                        </div>
                    </div>

                    <div class="d-flex justify-content-between pt-3 border-top">
                        <a th:href="@{/entrenadores}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-arrow-left me-1"></i> Cancelar
                        </a>
                        <button type="submit" id="btnGuardar" class="btn btn-success px-4 fw-bold">
                            <i class="bi bi-save me-1"></i> <span id="btnTexto">Guardar vía POST /api/entrenadores</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const idEdicion = document.getElementById('entrenadorId').value;

        document.addEventListener('DOMContentLoaded', () => {
            if (idEdicion && idEdicion !== 'null') {
                document.getElementById('formTitulo').innerText = `Editar Entrenador #${idEdicion} (vía PUT /api/entrenadores/${idEdicion})`;
                document.getElementById('btnTexto').innerText = `Actualizar vía PUT /api/entrenadores/${idEdicion}`;
                cargarDatos(idEdicion);
            }
        });

        async function cargarDatos(id) {
            try {
                const res = await fetch(`/api/entrenadores/${id}`);
                if (!res.ok) throw new Error('Entrenador no encontrado');
                const e = await res.json();
                document.getElementById('nombre').value = e.nombre;
                document.getElementById('apellido').value = e.apellido;
                document.getElementById('edad').value = e.edad;
                document.getElementById('nacionalidad').value = e.nacionalidad;
            } catch (err) {
                document.getElementById('alertaError').innerText = err.message;
                document.getElementById('alertaError').classList.remove('d-none');
            }
        }

        async function guardarEntrenador(ev) {
            ev.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;

            const payload = {
                nombre: document.getElementById('nombre').value.trim(),
                apellido: document.getElementById('apellido').value.trim(),
                edad: Number(document.getElementById('edad').value),
                nacionalidad: document.getElementById('nacionalidad').value.trim()
            };

            const esEdicion = idEdicion && idEdicion !== 'null';
            const url = esEdicion ? `/api/entrenadores/${idEdicion}` : '/api/entrenadores';
            const method = esEdicion ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    window.location.href = '/entrenadores';
                } else {
                    const err = await res.json();
                    document.getElementById('alertaError').innerText = 'Error API REST: ' + (err.mensaje || 'Error al guardar');
                    document.getElementById('alertaError').classList.remove('d-none');
                    btn.disabled = false;
                }
            } catch (err) {
                document.getElementById('alertaError').innerText = 'Error de conexión: ' + err.message;
                document.getElementById('alertaError').classList.remove('d-none');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
