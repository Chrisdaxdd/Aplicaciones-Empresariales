<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolManager - Asociaciones (MongoDB REST)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <div th:replace="~{fragments/navbar :: navbar('asociaciones')}"></div>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-building text-danger me-2"></i>Asociaciones y Federaciones (MongoDB NoSQL)</h2>
                <p class="text-muted mb-0">Entidad de federaciones consumida mediante <code>GET /api/asociaciones</code></p>
            </div>
            <a th:href="@{/asociaciones/nuevo}" class="btn btn-danger px-3 shadow-sm">
                <i class="bi bi-plus-circle me-1"></i> Nueva Asociación
            </a>
        </div>

        <div id="alerta" class="alert alert-dismissible fade show shadow-sm d-none" role="alert">
            <span id="alertaTexto"></span>
            <button type="button" class="btn-close" onclick="document.getElementById('alerta').classList.add('d-none')"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Siglas</th>
                                <th>Nombre Oficial</th>
                                <th>País</th>
                                <th>Presidente Actual</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyAsociaciones">
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <span class="spinner-border spinner-border-sm me-2 text-danger"></span>Cargando asociaciones desde la API REST...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', cargarAsociaciones);

        async function cargarAsociaciones() {
            try {
                const res = await fetch('/api/asociaciones');
                const asociaciones = await res.json();
                const tbody = document.getElementById('tbodyAsociaciones');

                if (!asociaciones || asociaciones.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted"><i class="bi bi-building-slash fs-1 d-block mb-2"></i>No hay asociaciones registradas en MongoDB.</td></tr>';
                    return;
                }

                tbody.innerHTML = asociaciones.map(a => `
                    <tr>
                        <td class="ps-4 fw-bold">${a.id}</td>
                        <td><span class="badge bg-danger fs-6 px-2 py-1">${a.siglas}</span></td>
                        <td class="fw-bold">${a.nombre}</td>
                        <td><i class="bi bi-geo-alt text-muted me-1"></i>${a.pais}</td>
                        <td><i class="bi bi-person me-1 text-muted"></i>${a.presidente}</td>
                        <td class="text-end pe-4">
                            <div class="btn-group">
                                <a href="/asociaciones/editar/${a.id}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                <button onclick="eliminarAsociacion(${a.id})" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('tbodyAsociaciones').innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        async function eliminarAsociacion(id) {
            if (confirm(`¿Eliminar asociación #${id} mediante DELETE /api/asociaciones/${id}?`)) {
                try {
                    const res = await fetch(`/api/asociaciones/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        mostrarAlerta('Asociación eliminada exitosamente mediante API REST', 'success');
                        cargarAsociaciones();
                    } else {
                        mostrarAlerta('Error al eliminar en la API REST', 'danger');
                    }
                } catch (e) {
                    mostrarAlerta('Error de conexión: ' + e.message, 'danger');
                }
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.className = `alert alert-${tipo} alert-dismissible fade show shadow-sm`;
            document.getElementById('alertaTexto').innerText = mensaje;
            alerta.classList.remove('d-none');
        }
    </script>
</body>
</html>
