<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolManager - Formulario de Asociación (REST API)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <div th:replace="~{fragments/navbar :: navbar('asociaciones')}"></div>

    <main class="container my-5" style="max-width: 700px;">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-danger text-white py-3">
                <h4 class="mb-0 fw-bold">
                    <i class="bi bi-building-add me-2"></i>
                    <span id="formTitulo">Registrar Asociación (vía POST /api/asociaciones)</span>
                </h4>
            </div>
            <div class="card-body p-4">
                <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

                <form id="formAsociacion" onsubmit="guardarAsociacion(event)">
                    <input type="hidden" id="asociacionId" th:value="${asociacionId}" />

                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label for="nombre" class="form-label fw-bold">Nombre Oficial de la Asociación <span class="text-danger">*</span></label>
                            <input type="text" id="nombre" class="form-control" required placeholder="Ej. Federación Colombiana de Fútbol, CONMEBOL" />
                        </div>

                        <div class="col-md-4">
                            <label for="siglas" class="form-label fw-bold">Siglas <span class="text-danger">*</span></label>
                            <input type="text" id="siglas" class="form-control" required placeholder="Ej. FCF, CONMEBOL, UEFA" />
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="pais" class="form-label fw-bold">País / Jurisdicción <span class="text-danger">*</span></label>
                            <input type="text" id="pais" class="form-control" required placeholder="Ej. Colombia, Paraguay, Europa" />
                        </div>

                        <div class="col-md-6">
                            <label for="presidente" class="form-label fw-bold">Presidente <span class="text-danger">*</span></label>
                            <input type="text" id="presidente" class="form-control" required placeholder="Ej. Ramón Jesurún, Alejandro Domínguez" />
                        </div>
                    </div>

                    <div class="d-flex justify-content-between pt-3 border-top">
                        <a th:href="@{/asociaciones}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-arrow-left me-1"></i> Cancelar
                        </a>
                        <button type="submit" id="btnGuardar" class="btn btn-danger px-4 fw-bold">
                            <i class="bi bi-save me-1"></i> <span id="btnTexto">Guardar vía POST /api/asociaciones</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const idEdicion = document.getElementById('asociacionId').value;

        document.addEventListener('DOMContentLoaded', () => {
            if (idEdicion && idEdicion !== 'null') {
                document.getElementById('formTitulo').innerText = `Editar Asociación #${idEdicion} (vía PUT /api/asociaciones/${idEdicion})`;
                document.getElementById('btnTexto').innerText = `Actualizar vía PUT /api/asociaciones/${idEdicion}`;
                cargarDatos(idEdicion);
            }
        });

        async function cargarDatos(id) {
            try {
                const res = await fetch(`/api/asociaciones/${id}`);
                if (!res.ok) throw new Error('Asociación no encontrada');
                const a = await res.json();
                document.getElementById('nombre').value = a.nombre;
                document.getElementById('siglas').value = a.siglas;
                document.getElementById('pais').value = a.pais;
                document.getElementById('presidente').value = a.presidente;
            } catch (err) {
                document.getElementById('alertaError').innerText = err.message;
                document.getElementById('alertaError').classList.remove('d-none');
            }
        }

        async function guardarAsociacion(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;

            const payload = {
                nombre: document.getElementById('nombre').value.trim(),
                siglas: document.getElementById('siglas').value.trim(),
                pais: document.getElementById('pais').value.trim(),
                presidente: document.getElementById('presidente').value.trim()
            };

            const esEdicion = idEdicion && idEdicion !== 'null';
            const url = esEdicion ? `/api/asociaciones/${idEdicion}` : '/api/asociaciones';
            const method = esEdicion ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    window.location.href = '/asociaciones';
                } else {
                    const err = await res.json();
                    document.getElementById('alertaError').innerText = 'Error API REST: ' + (err.mensaje || 'Error al guardar');
                    document.getElementById('alertaError').classList.remove('d-none');
                    btn.disabled = false;
                }
            } catch (err) {
                document.getElementById('alertaError').innerText = 'Error de conexión: ' + err.message;
                document.getElementById('alertaError').classList.remove('d-none');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
