<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolManager - Jugadores (MongoDB REST)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <div th:replace="~{fragments/navbar :: navbar('jugadores')}"></div>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-people text-info me-2"></i>Plantel de Jugadores (MongoDB NoSQL)</h2>
                <p class="text-muted mb-0">Futbolistas consumidos mediante <code>GET /api/jugadores</code> y vinculados por <code>@DocumentReference</code></p>
            </div>
            <a th:href="@{/jugadores/nuevo}" class="btn btn-info text-white px-3 shadow-sm">
                <i class="bi bi-plus-circle me-1"></i> Registrar Jugador
            </a>
        </div>

        <div id="alerta" class="alert alert-dismissible fade show shadow-sm d-none" role="alert">
            <span id="alertaTexto"></span>
            <button type="button" class="btn-close" onclick="document.getElementById('alerta').classList.add('d-none')"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Dorsal</th>
                                <th>Nombre Completo</th>
                                <th>Posición</th>
                                <th>Club Asignado</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyJugadores">
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <span class="spinner-border spinner-border-sm me-2 text-info"></span>Cargando futbolistas desde la API REST...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', cargarJugadores);

        async function cargarJugadores() {
            try {
                const [resJ, resC] = await Promise.all([fetch('/api/jugadores'), fetch('/api/clubes')]);
                const jugadores = await resJ.json();
                const clubes = await resC.json();

                // Mapear cada jugador a su club asignado
                const clubMap = {};
                clubes.forEach(c => {
                    if (c.jugadores) {
                        c.jugadores.forEach(j => {
                            clubMap[j.id] = c;
                        });
                    }
                });

                const tbody = document.getElementById('tbodyJugadores');
                if (!jugadores || jugadores.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted"><i class="bi bi-people-slash fs-1 d-block mb-2"></i>No hay jugadores registrados en MongoDB.</td></tr>';
                    return;
                }

                tbody.innerHTML = jugadores.map(j => {
                    const clubAsignado = clubMap[j.id];
                    let badgePos = 'bg-danger';
                    if (j.posicion === 'Portero') badgePos = 'bg-secondary';
                    else if (j.posicion === 'Defensa') badgePos = 'bg-primary';
                    else if (j.posicion === 'Mediocampista') badgePos = 'bg-warning text-dark';

                    return `
                        <tr>
                            <td class="ps-4 fw-bold">${j.id}</td>
                            <td>
                                <span class="badge bg-dark rounded-circle p-2 fs-6 fw-bold" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;">
                                    ${j.numero}
                                </span>
                            </td>
                            <td class="fw-bold">${j.nombre} ${j.apellido}</td>
                            <td><span class="badge ${badgePos}">${j.posicion}</span></td>
                            <td>
                                ${clubAsignado ? `
                                    <a href="/clubes/editar/${clubAsignado.id}" class="text-decoration-none fw-bold text-success">
                                        <i class="bi bi-shield-shaded me-1"></i>${clubAsignado.nombre}
                                    </a>
                                ` : '<span class="badge bg-light text-muted border">Agente Libre (Sin Club)</span>'}
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <a href="/jugadores/editar/${j.id}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                    <button onclick="eliminarJugador(${j.id})" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('tbodyJugadores').innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        async function eliminarJugador(id) {
            if (confirm(`¿Eliminar futbolista #${id} mediante DELETE /api/jugadores/${id}?`)) {
                try {
                    const res = await fetch(`/api/jugadores/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        mostrarAlerta('Futbolista eliminado exitosamente mediante API REST', 'success');
                        cargarJugadores();
                    } else {
                        mostrarAlerta('Error al eliminar en la API REST', 'danger');
                    }
                } catch (e) {
                    mostrarAlerta('Error de conexión: ' + e.message, 'danger');
                }
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.className = `alert alert-${tipo} alert-dismissible fade show shadow-sm`;
            document.getElementById('alertaTexto').innerText = mensaje;
            alerta.classList.remove('d-none');
        }
    </script>
</body>
</html>
