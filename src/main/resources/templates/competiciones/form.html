<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolManager - Formulario de Competición (REST API)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <div th:replace="~{fragments/navbar :: navbar('competiciones')}"></div>

    <main class="container my-5" style="max-width: 700px;">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-warning text-dark py-3">
                <h4 class="mb-0 fw-bold">
                    <i class="bi bi-trophy me-2"></i>
                    <span id="formTitulo">Registrar Competición (vía POST /api/competiciones)</span>
                </h4>
            </div>
            <div class="card-body p-4">
                <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

                <form id="formCompeticion" onsubmit="guardarCompeticion(event)">
                    <input type="hidden" id="competicionId" th:value="${competicionId}" />

                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre del Torneo / Competición <span class="text-danger">*</span></label>
                        <input type="text" id="nombre" class="form-control form-control-lg" required
                               placeholder="Ej. Copa Libertadores, Champions League, Liga BetPlay" />
                    </div>

                    <div class="mb-3">
                        <label for="montoPremio" class="form-label fw-bold">Monto del Premio Económico (USD) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" id="montoPremio" class="form-control" required
                                   placeholder="Ej. 10000000.00" value="1000000" />
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="fechaInicio" class="form-label fw-bold">Fecha de Inicio <span class="text-danger">*</span></label>
                            <input type="date" id="fechaInicio" class="form-control" required />
                        </div>

                        <div class="col-md-6">
                            <label for="fechaFin" class="form-label fw-bold">Fecha de Finalización <span class="text-danger">*</span></label>
                            <input type="date" id="fechaFin" class="form-control" required />
                        </div>
                    </div>

                    <div class="d-flex justify-content-between pt-3 border-top">
                        <a th:href="@{/competiciones}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-arrow-left me-1"></i> Cancelar
                        </a>
                        <button type="submit" id="btnGuardar" class="btn btn-warning px-4 fw-bold">
                            <i class="bi bi-save me-1"></i> <span id="btnTexto">Guardar vía POST /api/competiciones</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const idEdicion = document.getElementById('competicionId').value;

        document.addEventListener('DOMContentLoaded', () => {
            if (idEdicion && idEdicion !== 'null') {
                document.getElementById('formTitulo').innerText = `Editar Competición #${idEdicion} (vía PUT /api/competiciones/${idEdicion})`;
                document.getElementById('btnTexto').innerText = `Actualizar vía PUT /api/competiciones/${idEdicion}`;
                cargarDatos(idEdicion);
            }
        });

        async function cargarDatos(id) {
            try {
                const res = await fetch(`/api/competiciones/${id}`);
                if (!res.ok) throw new Error('Competición no encontrada');
                const c = await res.json();
                document.getElementById('nombre').value = c.nombre;
                document.getElementById('montoPremio').value = c.montoPremio;
                document.getElementById('fechaInicio').value = c.fechaInicio;
                document.getElementById('fechaFin').value = c.fechaFin;
            } catch (err) {
                document.getElementById('alertaError').innerText = err.message;
                document.getElementById('alertaError').classList.remove('d-none');
            }
        }

        async function guardarCompeticion(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;

            const payload = {
                nombre: document.getElementById('nombre').value.trim(),
                montoPremio: Number(document.getElementById('montoPremio').value),
                fechaInicio: document.getElementById('fechaInicio').value,
                fechaFin: document.getElementById('fechaFin').value
            };

            const esEdicion = idEdicion && idEdicion !== 'null';
            const url = esEdicion ? `/api/competiciones/${idEdicion}` : '/api/competiciones';
            const method = esEdicion ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    window.location.href = '/competiciones';
                } else {
                    const err = await res.json();
                    document.getElementById('alertaError').innerText = 'Error API REST: ' + (err.mensaje || 'Error al guardar');
                    document.getElementById('alertaError').classList.remove('d-none');
                    btn.disabled = false;
                }
            } catch (err) {
                document.getElementById('alertaError').innerText = 'Error de conexión: ' + err.message;
                document.getElementById('alertaError').classList.remove('d-none');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
