<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutbolManager - Competiciones (MongoDB REST)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <div th:replace="~{fragments/navbar :: navbar('competiciones')}"></div>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-trophy text-warning me-2"></i>Calendario de Competiciones (MongoDB NoSQL)</h2>
                <p class="text-muted mb-0">Torneos y ligas consumidos mediante <code>GET /api/competiciones</code></p>
            </div>
            <a th:href="@{/competiciones/nuevo}" class="btn btn-warning px-3 shadow-sm fw-bold">
                <i class="bi bi-plus-circle me-1"></i> Nueva Competición
            </a>
        </div>

        <div id="alerta" class="alert alert-dismissible fade show shadow-sm d-none" role="alert">
            <span id="alertaTexto"></span>
            <button type="button" class="btn-close" onclick="document.getElementById('alerta').classList.add('d-none')"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Nombre del Torneo</th>
                                <th>Monto del Premio (USD)</th>
                                <th>Fecha Inicio</th>
                                <th>Fecha Fin</th>
                                <th>Estado de Vigencia</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyCompeticiones">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <span class="spinner-border spinner-border-sm me-2 text-warning"></span>Cargando competiciones desde la API REST...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', cargarCompeticiones);

        async function cargarCompeticiones() {
            try {
                const res = await fetch('/api/competiciones');
                const comps = await res.json();
                const tbody = document.getElementById('tbodyCompeticiones');

                if (!comps || comps.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted"><i class="bi bi-trophy-slash fs-1 d-block mb-2"></i>No hay competiciones registradas en MongoDB.</td></tr>';
                    return;
                }

                tbody.innerHTML = comps.map(c => {
                    const hoy = new Date().toISOString().split('T')[0];
                    const esVigente = c.fechaInicio && c.fechaFin && hoy >= c.fechaInicio && hoy <= c.fechaFin;

                    return `
                        <tr>
                            <td class="ps-4 fw-bold">${c.id}</td>
                            <td><span class="fw-bold text-dark fs-6">${c.nombre}</span></td>
                            <td>
                                <span class="badge bg-success bg-opacity-10 text-success fs-6 fw-bold border border-success border-opacity-25 px-2 py-1">
                                    $${Number(c.montoPremio).toLocaleString('es-CO', { minimumFractionDigits: 2 })}
                                </span>
                            </td>
                            <td><i class="bi bi-calendar-event me-1 text-muted"></i>${c.fechaInicio || ''}</td>
                            <td><i class="bi bi-calendar-check me-1 text-muted"></i>${c.fechaFin || ''}</td>
                            <td>
                                ${esVigente ? `
                                    <span class="badge bg-success"><i class="bi bi-check-circle me-1"></i> En Curso / Activa</span>
                                ` : `
                                    <span class="badge bg-secondary"><i class="bi bi-clock-history me-1"></i> Inactiva / Finalizada</span>
                                `}
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <a href="/competiciones/editar/${c.id}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil-square"></i></a>
                                    <button onclick="eliminarCompeticion(${c.id})" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('tbodyCompeticiones').innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        async function eliminarCompeticion(id) {
            if (confirm(`¿Eliminar competición #${id} mediante DELETE /api/competiciones/${id}?`)) {
                try {
                    const res = await fetch(`/api/competiciones/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        mostrarAlerta('Competición eliminada exitosamente mediante API REST', 'success');
                        cargarCompeticiones();
                    } else {
                        mostrarAlerta('Error al eliminar en la API REST', 'danger');
                    }
                } catch (e) {
                    mostrarAlerta('Error de conexión: ' + e.message, 'danger');
                }
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.className = `alert alert-${tipo} alert-dismissible fade show shadow-sm`;
            document.getElementById('alertaTexto').innerText = mensaje;
            alerta.classList.remove('d-none');
        }
    </script>
</body>
</html>
